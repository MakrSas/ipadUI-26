name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid make xz

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"

      - name: Build rootless package
        run: |
          export THEOS="$HOME/theos"
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - uses: actions/upload-artifact@v4
        with:
          name: iPadUI26-rootless
          path: packages/*.deb
