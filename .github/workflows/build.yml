name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid make xz

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"

      # Xcode's SDK has no private frameworks (Preferences), so use Theos' patched SDK
      # while still compiling with Xcode's clang for the current arm64e ABI.
      - name: Install patched SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

      - name: Build rootless package
        run: |
          export THEOS="$HOME/theos"
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - uses: actions/upload-artifact@v4
        with:
          name: iPadUI26-rootless
          path: packages/*.deb
